<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php index.html


    # Route /api to /var/www/html/api
    Alias /api /var/www/html/api
    <Directory /var/www/html/api>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Route /assets to /var/www/html/assets
    Alias /assets /var/www/html/assets
    <Directory /var/www/html/assets>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Public document root
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Protect sensitive backend directories
    <Directory /var/www/html/config>
        Require all denied
    </Directory>
    <Directory /var/www/html/includes>
        Require all denied
    </Directory>
    <Directory /var/www/html/cron>
        Require all denied
    </Directory>
    <Directory /var/www/html/database>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
